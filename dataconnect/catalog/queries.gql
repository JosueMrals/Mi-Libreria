# Catalog (Fase 3) — queries.
#
# Reutiliza exactamente el patron de autorizacion de Fase 2 (dataconnect/identity/): permiso
# concreto via @check sobre userProfiles(where:{firebaseUid:{eq_expr:"auth.uid"}}), usando
# indexado this[0] (no this.exists(u,...)) para no superar el limite de anidamiento de CEL de
# 2 niveles ya detectado en Fase 2 (r.exists(...p.exists(...))).
#
# Catalogo de referencia sin permiso especifico (igual razonamiento que ListRoles/
# ListPermissions en Fase 2: no exponen datos de negocio ni de otros usuarios, y la seccion 47
# no define "productTypes.read"/"unitsOfMeasure.read"/"currencies.read"/"genres.read"/
# "bookSeries.read"): ListProductTypes, ListUnitsOfMeasure, ListCurrencies, ListGenres,
# ListBookSeries. Solo exigen sesion ACTIVE.
#
# Toda lista/busqueda tiene limite obligatorio (seccion 43): "limit" nunca es opcional sin
# tope; el propio @check rechaza limit > 200 ademas del permiso, para que un cliente no pueda
# pedir el catalogo completo de una vez ("fail closed" tambien aplica a paginacion).

# ---------- Catalogo de referencia (ACTIVE, sin permiso especifico) ----------

query ListProductTypes @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
    expr: "this.exists(u, u.status == 'ACTIVE')"
    message: "El perfil no esta activo"
  ) {
    status
  }
  productTypes(where: { status: { eq: "ACTIVE" } }) {
    id
    code
    name
    description
  }
}

