# ---------- Categorias (categories.read) ----------

query ListRootCategories($limit: Int = 50) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'categories.read')) && ((!has(vars.limit) || vars.limit == null) || vars.limit <= 200)"
    message: "Requiere permiso categories.read (limite maximo 200)"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  categories(where: { parentId: { isNull: true } }, limit: $limit) {
    id
    name
    code
    description
    status
  }
}

query ListCategoryChildren($parentId: UUID!, $limit: Int = 50) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'categories.read')) && ((!has(vars.limit) || vars.limit == null) || vars.limit <= 200)"
    message: "Requiere permiso categories.read (limite maximo 200)"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  categories(where: { parentId: { eq: $parentId } }, limit: $limit) {
    id
    name
    code
    description
    status
  }
}

