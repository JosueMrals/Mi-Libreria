# ---------- Precios (prices.read — separado de products.read, seccion 31) ----------

query ListProductPrices($productId: UUID!) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'prices.read'))"
    message: "Requiere permiso prices.read"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  productPrices(where: { productId: { eq: $productId } }, orderBy: { validFrom: DESC }) {
    id
    priceType
    amount
    currency { code symbol }
    validFrom
    validTo
    status
  }
}

# ---------- Metadata bibliografica (book_metadata.read — separado de products.read) ----------

query GetBookDetails($productId: UUID!) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'book_metadata.read'))"
    message: "Requiere permiso book_metadata.read"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  bookDetails(key: { productId: $productId }) {
    title
    subtitle
    isbn10
    isbn13
    language
    editionNumber
    publicationDate
    pageCount
    format
    synopsis
    coverImageUrl
    series { id name }
    volumeNumber
    bookAuthors_on_bookDetails {
      authorRole
      displayOrder
      author { id displayName }
    }
    bookPublishers_on_bookDetails {
      isPrimary
      publisher { id name }
    }
    bookGenres_on_bookDetails {
      genre { id name }
    }
  }
}
