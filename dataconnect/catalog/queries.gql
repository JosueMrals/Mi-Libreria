# ---------- Product (products.read — permiso ya existente desde Fase 2) ----------

query GetProduct($id: UUID!) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.read'))"
    message: "Requiere permiso products.read"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  product(id: $id) {
    id
    sku
    name
    shortName
    description
    status
    isSellable
    isPurchasable
    isInventoried
    productType { id code name }
    category { id name code }
    brand { id name code }
    unitOfMeasure { id code name symbol }
    taxCategory { id code name ratePercent }
    createdAt
    updatedAt
  }
}

query GetProductBySKU($sku: String!) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.read'))"
    message: "Requiere permiso products.read"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  products(where: { sku: { eq: $sku } }) {
    id
    sku
    name
    status
    productType { code }
    category { name }
    brand { name }
  }
}

# Barcode unificado: EAN | UPC | GTIN | SUPPLIER_CODE | INTERNAL_CODE | SKU, todos via
# ProductIdentifier (seccion 15: no asumir 1 Product = 1 barcode).
query GetProductByBarcode($value: String!) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.read'))"
    message: "Requiere permiso products.read"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  productIdentifiers(where: { value: { eq: $value } }) {
    type
    value
    isPrimary
    product {
      id
      sku
      name
      status
    }
  }
}

query GetProductByISBN($isbn: String!) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.read'))"
    message: "Requiere permiso products.read"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  byIsbn13: bookDetailss(where: { isbn13: { eq: $isbn } }) {
    product { id sku name status }
    title
    isbn10
    isbn13
  }
  byIsbn10: bookDetailss(where: { isbn10: { eq: $isbn } }) {
    product { id sku name status }
    title
    isbn10
    isbn13
  }
}

query SearchProducts($text: String!, $limit: Int = 20, $offset: Int = 0) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.read')) && ((!has(vars.limit) || vars.limit == null) || vars.limit <= 200)"
    message: "Requiere permiso products.read (limite maximo 200)"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
  }
  products(
    where: { _or: [{ name: { contains: $text } }, { sku: { contains: $text } }] }
    limit: $limit
    offset: $offset
  ) {
    id
    sku
    name
    status
    productType { code }
  }
}

