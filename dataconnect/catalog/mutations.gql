# ---------- BookDetails (book_metadata.*) ----------
#
# Validacion de ISBN (seccion 16/41, endurecida en Fase 3.1 secciones 3/4/5): formato
# normalizado (solo digitos, sin guiones/espacios) via regex CEL en el @check de abajo, MAS
# checksum matematico real (mod-11 para ISBN-10 con soporte de X, mod-10 para ISBN-13) via
# Native SQL en CreateBookDetails — ver el comentario junto a "bookDetails: _executeReturningFirst"
# y docs/catalog.md para el detalle completo, incluyendo los hallazgos de plataforma
# encontrados al implementarlo. La normalizacion (quitar guiones) es responsabilidad del
# cliente/SDK: el servidor rechaza cualquier formato que no sea ya normalizado.

mutation CreateBookDetails(
  $productId: UUID!
  $title: String!
  $subtitle: String
  $isbn10: String
  $isbn13: String
  $language: String
  $format: String
) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'book_metadata.create')) && (!has(vars.isbn10) || vars.isbn10 == null || vars.isbn10.matches('^[0-9]{9}[0-9X]$')) && (!has(vars.isbn13) || vars.isbn13 == null || vars.isbn13.matches('^[0-9]{13}$'))"
      message: "Requiere permiso book_metadata.create, o ISBN10/ISBN13 con formato invalido (solo digitos normalizados)"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
    # Fase 3.1, seccion 18: BookDetails solo tiene sentido sobre un Product de tipo BOOK (un
    # mouse no tiene ISBN). Sin este check, cualquier Product podia recibir BookDetails.
    targetProduct: products(where: { id: { eq: $productId } }) @check(
      expr: "this.size() > 0 && this[0].productType.code == 'BOOK'"
      message: "BookDetails solo puede asociarse a un Product de productType BOOK"
    ) {
      productType { code }
    }
  }
  # Fase 3.1, seccion 3/4: checksum matematico real (no solo formato). CEL no tiene forma de
  # extraer caracteres individuales de un string (sin substring/index para strings), asi que
  # el checksum se calcula en Native SQL (soportado oficialmente, ver docs/catalog.md#isbn).
  # El formato ya fue validado arriba por @check; aqui solo se verifica el digito de control.
  #
  # DISENO (tras varias iteraciones, ver docs/catalog.md#hallazgos-de-plataforma): el checksum
  # se evalua como condicion booleana en el WHERE del INSERT (nunca en un CASE que devuelva
  # valores de tipos distintos por rama, ni en un WITH anidado dentro de otro WITH: ambos
  # patrones rompen el protocolo de este emulador local — ver el hallazgo de plataforma
  # completo en docs/catalog.md). Si el checksum es invalido, el INSERT no produce ninguna
  # fila (0 rows) y el mutation devuelve "bookDetails: null", sin excepcion — el cliente debe
  # tratar un resultado null como "ISBN rechazado por checksum".
  #
  # LIMITE ACEPTADO Y DOCUMENTADO: a diferencia del resto de mutations de este archivo, aqui
  # "auditLog_insert" se ejecuta como campo separado (patron estandar), no encadenado al
  # resultado del INSERT nativo — no hay forma de condicionarlo a "solo si se inserto la fila"
  # sin volver a un WITH anidado (que rompe el emulador). Consecuencia real: si el checksum es
  # invalido, igual se registra un AuditLog "BOOK_METADATA_UPDATED" aunque no se haya creado
  # ningun BookDetails. No es un hueco de seguridad (el actor sigue siendo auth.uid, la accion
  # describe la intencion real de la llamada), pero es una imprecision de auditoria conocida.
  bookDetails: _executeReturningFirst(
    sql: """
      INSERT INTO "public"."book_details"
        ("product_id", "title", "subtitle", "isbn10", "isbn13", "language", "format", "created_at", "updated_at")
      SELECT $1, $2, $3, $4, $5, $6, $7, now(), now()
      WHERE
        ($8::text IS NULL OR (
          SELECT SUM(
            (CASE WHEN i = 10 AND upper(substring($9 from 10 for 1)) = 'X'
                  THEN 10
                  ELSE substring($10 from i for 1)::int
             END) * (11 - i)
          ) FROM generate_series(1, 10) AS i
        ) % 11 = 0)
        AND
        ($11::text IS NULL OR (
          SELECT SUM(
            substring($12 from i for 1)::int * (CASE WHEN i % 2 = 1 THEN 1 ELSE 3 END)
          ) FROM generate_series(1, 13) AS i
        ) % 10 = 0)
      RETURNING "product_id", "title", "isbn10", "isbn13"
    """
    params: [
      $productId, $title, $subtitle, $isbn10, $isbn13, $language, $format
      $isbn10, $isbn10, $isbn10
      $isbn13, $isbn13
    ]
  )
  auditLog_insert(data: { action: "BOOK_METADATA_UPDATED", entityType: "Product", entityId: $productId })
}

# Fase 3.1, seccion 22: volumeNumber/pageCount no deben aceptar valores imposibles (negativos).
mutation UpdateBookDetails(
  $productId: UUID!
  $title: String
  $subtitle: String
  $synopsis: String
  $pageCount: Int
  $format: String
  $seriesId: UUID
  $volumeNumber: Int
) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'book_metadata.update')) && (!has(vars.pageCount) || vars.pageCount == null || vars.pageCount >= 0) && (!has(vars.volumeNumber) || vars.volumeNumber == null || vars.volumeNumber >= 1)"
      message: "Requiere permiso book_metadata.update, o pageCount/volumeNumber invalido (deben ser >= 0 y >= 1 respectivamente)"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  bookDetails_update(key: { productId: $productId }, data: { title: $title, subtitle: $subtitle, synopsis: $synopsis, pageCount: $pageCount, format: $format, seriesId: $seriesId, volumeNumber: $volumeNumber, updatedAt_expr: "request.time" })
  auditLog_insert(data: { action: "BOOK_METADATA_UPDATED", entityType: "Product", entityId: $productId })
}

