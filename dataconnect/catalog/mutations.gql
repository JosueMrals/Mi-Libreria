# ---------- ProductImage (products.update — seccion 26) ----------
# isPrimary NO es mutuamente excluyente hoy (igual que ProductIdentifier.isPrimary, Fase 3):
# el schema no tiene un indice UNIQUE parcial que fuerce "a lo sumo una imagen primaria por
# producto", asi que crear varias con isPrimary=true es aceptado. Documentado como decision
# consciente (no como bug) en docs/catalog.md — forzarlo requeriria un UNIQUE parcial
# (WHERE isPrimary) o logica de "desmarcar la anterior", fuera de alcance de este hardening.

mutation CreateProductImage($newImageId: UUID!, $productId: UUID!, $url: String!, $type: String!, $isPrimary: Boolean!, $displayOrder: Int!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.update'))"
      message: "Requiere permiso products.update"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  productImage_insert(data: { id: $newImageId, productId: $productId, url: $url, type: $type, isPrimary: $isPrimary, displayOrder: $displayOrder })
  auditLog_insert(data: { action: "PRODUCT_UPDATED", entityType: "Product", entityId: $productId })
}
