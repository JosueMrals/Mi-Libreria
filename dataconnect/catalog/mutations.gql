# ---------- ProductPrice (prices.update — separado de products.*, seccion 31) ----------

# Fase 3.1, seccion 8/9: no permitir precios invalidos. NaN/Infinity no son literales JSON
# validos, asi que un cliente estandar ya no puede enviarlos como variable GraphQL Float; el
# @check agrega ademas: no negativos, tope de negocio de 999,999.99 (ampliamente suficiente
# para cualquier articulo de libreria), y priceType restringido a los 4 valores del dominio
# (seccion 30) en vez de aceptar cualquier string.
#
# HALLAZGO DE PLATAFORMA (Fase 3.1): el tope de negocio se fijo deliberadamente MUY por debajo
# del limite real de la columna (numeric(12,2), hasta 9999999999.99): un valor que excede la
# capacidad real de la columna hace que Postgres lo rechace por overflow numerico al intentar
# bindear el parametro del INSERT, ANTES de que el resultado de este @check pueda evitar el
# intento — y ese error de overflow, en este emulador local, deja la conexion compartida en un
# estado invalido para requests posteriores (mismo tipo de fragilidad ya documentado en
# CreateBookDetails, ver docs/catalog.md). Fijar el tope de negocio muy por debajo del limite
# de la columna evita que un valor "solo un poco invalido" dispare ese problema.
mutation CreateProductPrice($newPriceId: UUID!, $productId: UUID!, $priceType: String!, $amount: Float!, $currencyId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'prices.update')) && vars.amount >= 0.0 && vars.amount <= 999999.99 && vars.priceType in ['COST', 'RETAIL', 'WHOLESALE', 'PROMOTIONAL']"
      message: "Requiere permiso prices.update, o monto/priceType invalido (0 <= monto <= 999999.99; priceType en COST/RETAIL/WHOLESALE/PROMOTIONAL)"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  productPrice_insert(data: { id: $newPriceId, productId: $productId, priceType: $priceType, amount: $amount, currencyId: $currencyId, status: "ACTIVE" })
  auditLog_insert(data: { action: "PRICE_CREATED", entityType: "Product", entityId: $productId })
}

# Fase 3.1: $status ahora se aplica de verdad (antes se declaraba pero nunca se usaba en
# productPrice_update — un precio no podia desactivarse). Restringido a ACTIVE/INACTIVE, igual
# que el resto de estados del catalogo (seccion 12).
mutation UpdateProductPrice($priceId: UUID!, $productId: UUID!, $amount: Float, $status: String) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'prices.update')) && (!has(vars.amount) || vars.amount == null || (vars.amount >= 0.0 && vars.amount <= 999999.99)) && (!has(vars.status) || vars.status == null || vars.status in ['ACTIVE', 'INACTIVE'])"
      message: "Requiere permiso prices.update, monto invalido, o status fuera de ACTIVE/INACTIVE"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  productPrice_update(id: $priceId, data: { amount: $amount, status: $status })
  auditLog_insert(data: { action: "PRICE_UPDATED", entityType: "Product", entityId: $productId })
}

# ---------- Category (categories.*) ----------
#
# Prevencion de ciclos (seccion 8): se comprueba que la nueva categoria padre no sea la misma
# categoria (auto-referencia, via variables — sin consulta) y que no este entre sus 3 primeros
# ancestros (via "has()" para navegar relaciones nullable de forma segura).
# ponytail: deteccion de ciclo acotada a 3 niveles de ancestros, no un grafo arbitrario — CEL
# no soporta recursion; una jerarquia mas profunda que intente un ciclo mas alla de ese rango
# no seria detectada aqui. Si se necesita una jerarquia mas profunda con esta garantia,
# resolverlo con un CTE recursivo en una capa de validacion adicional (Cloud Function) o
# ampliar manualmente los niveles siguiendo el mismo patron.

mutation CreateCategory($newCategoryId: UUID!, $name: String!, $code: String!, $description: String, $parentId: UUID) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'categories.create')) && ((!has(vars.parentId) || vars.parentId == null) || vars.parentId != vars.newCategoryId)"
      message: "Requiere permiso categories.create, o parentId invalido (auto-referencia)"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  category_insert(data: { id: $newCategoryId, name: $name, code: $code, description: $description, parentId: $parentId, status: "ACTIVE" })
  auditLog_insert(data: { action: "CATEGORY_CREATED", entityType: "Category", entityId: $newCategoryId })
}

mutation UpdateCategory($categoryId: UUID!, $name: String, $description: String, $parentId: UUID) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'categories.update')) && ((!has(vars.parentId) || vars.parentId == null) || vars.parentId != vars.categoryId)"
      message: "Requiere permiso categories.update, o parentId invalido (auto-referencia)"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
    newParent: categories(where: { id: { eq: $parentId } }) @check(
      expr: "(!has(vars.parentId) || vars.parentId == null) || this.exists(c, (!has(c.parent) || c.parent.id != vars.categoryId) && (!has(c.parent) || !has(c.parent.parent) || c.parent.parent.id != vars.categoryId) && (!has(c.parent) || !has(c.parent.parent) || !has(c.parent.parent.parent) || c.parent.parent.parent.id != vars.categoryId))"
      message: "Ciclo detectado: la nueva categoria padre desciende de la categoria que se esta moviendo"
    ) {
      id
      parent {
        id
        parent {
          id
          parent {
            id
          }
        }
      }
    }
  }
  category_update(id: $categoryId, data: { name: $name, description: $description, parentId: $parentId, updatedAt_expr: "request.time" })
  auditLog_insert(data: { action: "CATEGORY_UPDATED", entityType: "Category", entityId: $categoryId })
}

mutation DeactivateCategory($categoryId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'categories.delete'))"
      message: "Requiere permiso categories.delete"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  category_update(id: $categoryId, data: { status: "INACTIVE", updatedAt_expr: "request.time" })
  auditLog_insert(data: { action: "CATEGORY_UPDATED", entityType: "Category", entityId: $categoryId })
}

