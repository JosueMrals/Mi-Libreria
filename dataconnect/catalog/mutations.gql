  supplier_insert(data: { id: $newSupplierId, name: $name, legalName: $legalName, taxId: $taxId, email: $email, phone: $phone, address: $address, status: "ACTIVE" })
  auditLog_insert(data: { action: "SUPPLIER_CREATED", entityType: "Supplier", entityId: $newSupplierId })
}

