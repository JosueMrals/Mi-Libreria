# Catalog (Fase 3) — mutations.
#
# Reglas heredadas de Fase 2 (identity/mutations.gql), aplicadas igual aqui:
# 1. Ninguna mutation expone createdBy/updatedBy/performedByUid como variable de cliente — se
#    resuelven por auth.uid en servidor (schema/catalog.gql).
# 2. Cada mutation administrativa exige el permiso concreto via un bloque
#    "query @redact { ... @check(...) }" antes de escribir nada (fail closed, @transaction).
# 3. Cada mutation que cambia estado inserta su propio AuditLog en la misma transaccion.
# 4. Los UUID de filas nuevas se generan en el cliente cuando el AuditLog de la misma
#    operacion necesita referenciarlos.
#
# Separacion de permisos por diseno (seccion 31): products.update NO permite tocar precios.
# ProductPrice tiene sus propias mutations detras de prices.update.
#
# No se crean mutations para Author/Publisher fuera de Create/Update (seccion 44 no las pide);
# no hay "DeactivateAuthor"/"DeactivatePublisher" en esta fase — limitacion documentada en
# docs/catalog.md, no un descuido.

# ---------- Product ----------

mutation CreateProduct(
  $newProductId: UUID!
  $sku: String!
  $name: String!
  $shortName: String
  $description: String
  $productTypeId: UUID!
  $categoryId: UUID
  $brandId: UUID
  $unitOfMeasureId: UUID!
  $taxCategoryId: UUID
) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.create'))"
      message: "Requiere permiso products.create"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  product_insert(
    data: {
      id: $newProductId
      sku: $sku
      name: $name
      shortName: $shortName
      description: $description
      productTypeId: $productTypeId
      categoryId: $categoryId
      brandId: $brandId
      unitOfMeasureId: $unitOfMeasureId
      taxCategoryId: $taxCategoryId
      status: "ACTIVE"
      isSellable: true
      isPurchasable: true
      isInventoried: true
    }
  )
  auditLog_insert(data: { action: "PRODUCT_CREATED", entityType: "Product", entityId: $newProductId })
}

mutation UpdateProduct(
  $productId: UUID!
  $name: String
  $shortName: String
  $description: String
  $categoryId: UUID
  $brandId: UUID
  $taxCategoryId: UUID
  $isSellable: Boolean
  $isPurchasable: Boolean
  $isInventoried: Boolean
) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.update'))"
      message: "Requiere permiso products.update"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  product_update(
    id: $productId
    data: {
      name: $name
      shortName: $shortName
      description: $description
      categoryId: $categoryId
      brandId: $brandId
      taxCategoryId: $taxCategoryId
      isSellable: $isSellable
      isPurchasable: $isPurchasable
      isInventoried: $isInventoried
      updatedBy_expr: "auth.uid"
      updatedAt_expr: "request.time"
    }
  )
  auditLog_insert(data: { action: "PRODUCT_UPDATED", entityType: "Product", entityId: $productId })
}

# "Delete" = baja logica (seccion 45): products.delete gatea sacar el producto de circulacion,
# nunca DELETE fisico (no existe ninguna mutation que borre una fila Product).
mutation DeactivateProduct($productId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.delete'))"
      message: "Requiere permiso products.delete"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  product_update(id: $productId, data: { status: "INACTIVE", updatedBy_expr: "auth.uid", updatedAt_expr: "request.time" })
  auditLog_insert(data: { action: "PRODUCT_DEACTIVATED", entityType: "Product", entityId: $productId })
}

mutation DiscontinueProduct($productId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
