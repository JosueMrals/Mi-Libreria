# ---------- ProductIdentifier ----------

mutation CreateProductIdentifier($newIdentifierId: UUID!, $productId: UUID!, $type: String!, $value: String!, $isPrimary: Boolean!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.update'))"
      message: "Requiere permiso products.update"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  productIdentifier_insert(data: { id: $newIdentifierId, productId: $productId, type: $type, value: $value, isPrimary: $isPrimary })
  auditLog_insert(data: { action: "PRODUCT_IDENTIFIER_ADDED", entityType: "Product", entityId: $productId })
}

mutation RemoveProductIdentifier($type: String!, $value: String!, $productId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'products.update'))"
      message: "Requiere permiso products.update"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  # La key de la tabla es (type, value) — ver schema/catalog.gql. "id" existe como columna
  # pero no forma parte de la key declarada, asi que no es un argumento valido para _delete.
  productIdentifier_delete(key: { type: $type, value: $value })
  auditLog_insert(data: { action: "PRODUCT_IDENTIFIER_REMOVED", entityType: "Product", entityId: $productId })
}

