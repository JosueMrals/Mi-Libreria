# ---------- Sucursales (requiere branches.create / branches.update / users.update) ----------

mutation CreateBranch($newBranchId: UUID!, $name: String!, $code: String!, $address: String, $phone: String) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'branches.create'))"
      message: "Requiere permiso branches.create"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  branch_insert(data: { id: $newBranchId, name: $name, code: $code, address: $address, phone: $phone, status: "ACTIVE" })
  auditLog_insert(data: { action: "BRANCH_CREATED", entityType: "Branch", entityId: $newBranchId, branchId: $newBranchId })
}

mutation UpdateBranch($branchId: UUID!, $name: String, $address: String, $phone: String) @auth(level: USER) @transaction {
