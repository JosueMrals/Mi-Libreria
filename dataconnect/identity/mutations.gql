      message: "Requiere permiso branches.update"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  branch_update(id: $branchId, data: { name: $name, address: $address, phone: $phone, updatedAt_expr: "request.time" })
  auditLog_insert(data: { action: "BRANCH_UPDATED", entityType: "Branch", entityId: $branchId, branchId: $branchId })
}

