# ---------- Roles y permisos (requiere roles.manage / permissions.manage) ----------

mutation CreateRole($newRoleId: UUID!, $name: String!, $description: String) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'roles.manage'))"
      message: "Requiere permiso roles.manage"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  role_insert(data: { id: $newRoleId, name: $name, description: $description })
  auditLog_insert(data: { action: "ROLE_CREATED", entityType: "Role", entityId: $newRoleId })
}

mutation UpdateRoleDescription($roleId: UUID!, $description: String) @auth(level: USER) @transaction {
  query @redact {
    userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @check(
      expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'roles.manage'))"
      message: "Requiere permiso roles.manage"
    ) {
      status
      roles_via_UserRole { permissions_via_RolePermission { name } }
    }
  }
  # El nombre del rol no es editable aqui a proposito: es la clave logica referenciada por
  # los checks de autorizacion y por el seed de datos; renombrarlo en caliente es una
  # operacion administrativa distinta y mas delicada, fuera del alcance de esta fase.
  role_update(id: $roleId, data: { description: $description })
  auditLog_insert(data: { action: "ROLE_UPDATED", entityType: "Role", entityId: $roleId })
}

