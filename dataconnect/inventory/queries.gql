query ListInventoryMovements(
  $branchId: UUID!
  $productId: UUID
  $movementType: String
  $limit: Int = 50
  $offset: Int = 0
) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'inventory.read')) && this[0].userBranches_on_userProfile.exists(ub, ub.branch.id == vars.branchId) && (!has(vars.limit) || vars.limit == null || vars.limit <= 200)"
    message: "Requiere permiso inventory.read, acceso a la sucursal, o limite maximo 200"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
    userBranches_on_userProfile { branch { id } }
  }
  inventoryMovements(
    where: {
      branchId: { eq: $branchId }
      productId: { eq: $productId }
      movementType: { eq: $movementType }
    }
    limit: $limit
    offset: $offset
    orderBy: { occurredAt: DESC }
  ) {
    id
    movementType
    quantity
    quantityBefore
    quantityAfter
    unitCost
    totalCost
    referenceType
    referenceId
    reason
    notes
    idempotencyKey
    occurredAt
    createdBy
    product { id name sku }
  }
}

