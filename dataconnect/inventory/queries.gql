# quantity <= minimumStock es una comparacion COLUMNA-CONTRA-COLUMNA que el DSL declarativo de
# "where" no puede expresar (solo columna-contra-literal/variable) — de ahi el uso de Native
# SQL de solo lectura (_select), permitido fuera de @check, combinado con @auth/@check a nivel
# de operacion (igual que las mutations de este archivo).
query GetLowStockProducts($branchId: UUID!, $limit: Int = 50, $offset: Int = 0) @auth(level: USER) {
  userProfiles(where: { firebaseUid: { eq_expr: "auth.uid" } }) @redact @check(
    expr: "this.size() > 0 && this[0].status == 'ACTIVE' && this[0].roles_via_UserRole.exists(r, r.permissions_via_RolePermission.exists(p, p.name == 'inventory.read')) && this[0].userBranches_on_userProfile.exists(ub, ub.branch.id == vars.branchId) && (!has(vars.limit) || vars.limit == null || vars.limit <= 200)"
    message: "Requiere permiso inventory.read, acceso a la sucursal, o limite maximo 200"
  ) {
    status
    roles_via_UserRole { permissions_via_RolePermission { name } }
    userBranches_on_userProfile { branch { id } }
  }
  items: _select(
    sql: """
      SELECT i.id AS id, i.quantity AS quantity, i.minimum_stock AS minimum_stock,
             p.id AS product_id, p.name AS product_name, p.sku AS sku
      FROM "public"."inventory" i
      JOIN "public"."product" p ON p.id = i.product_id
      WHERE i.branch_id = $1 AND i.minimum_stock IS NOT NULL AND i.quantity <= i.minimum_stock
      ORDER BY i.quantity ASC
      LIMIT $2 OFFSET $3
    """
    params: [$branchId, $limit, $offset]
  )
}

