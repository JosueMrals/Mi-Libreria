  # Nota: Product/BookDetails/ProductPrice NO se siembran aqui a proposito. Sus columnas
  # createdBy/updatedBy/createdBy tienen @default(expr:"auth.uid"), que SIEMPRE se evalua
  # (incluso si el insert intenta pasar un literal) y falla en contexto admin puro (CLI/
  # dataconnect:execute) porque no hay ningun usuario impersonado. Los productos de prueba se
  # crean con las mutations reales (CreateProduct/CreateBookDetails/CreateProductPrice)
  # impersonando a SUPER_ADMIN desde el script de pruebas E2E — ademas de sembrar datos,
  # eso ejercita las mutations reales igual que en Fase 2. Ver docs/catalog.md.
}

