mutation SeedRolePermission1 @transaction {
  # rolePermission_insertMany -> rolePermission_upsert por fila (idempotente: Fase 3.1, seccion 2).
  # SUPER_ADMIN: todos los permisos (autoridad total via datos, no via "if role == SUPER_ADMIN").
  # ADMIN: todo el negocio, usuarios y sucursales. NO permissions.manage/roles.manage
  # (evita que un ADMIN se auto-otorgue permisos o cree roles nuevos sin SUPER_ADMIN).
  # MANAGER: operacion completa de una sucursal, sin administracion de usuarios/roles.
  # CASHIER
  # INVENTORY
  # SELLER
  # AUDITOR: solo lectura de auditoria/reportes/usuarios/sucursales/catalogo.
