# Datos de prueba para Identity/RBAC/Branches (Fase 2, seccion 41).
# Solo para el emulador local. No representa cuentas reales.
#
# Los UserProfile de prueba usan firebaseUid ficticios (TEST_FIREBASE_UID_*) porque crear
# usuarios reales de Firebase Authentication requiere el Admin SDK / Auth Emulator UI, fuera
# del alcance de un archivo de mutations de Data Connect. Para probar los flujos @auth de
# extremo a extremo, crea esos mismos uid en el Auth Emulator y usa sus ID tokens.
#
# Ejecutar manualmente contra el emulador, por ejemplo con la extension de VS Code de Data
# Connect o "firebase dataconnect:sql:seed" segun la version de CLI instalada.

